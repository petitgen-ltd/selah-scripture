name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Python tests (engine + pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install pytest
      - name: Run tests
        run: python -m pytest -q

  proxy:
    name: Proxy Worker syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Type-check the Worker (syntax)
        run: node --check proxy/src/worker.js
